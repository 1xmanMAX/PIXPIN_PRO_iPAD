# PixPin para iPad, como proyecto de Xcode (XcodeGen).
#
# El `.xcodeproj` no se versiona: lo genera `xcodegen generate` aqui (o
# `herramientas/app.sh`). Se compila sin firmar; para ponerlo en un iPad se
# firma despues (Xcode con tu Apple ID, o `herramientas/app.sh ipa` y una
# herramienta de instalar como AltStore/Sideloadly).
#
# - `AppPixPin`: la app (iPadOS 18+), con `PixPinKit` del paquete local
#   `../app` y el nucleo de Rust `PixPinCore` (`../PixPinCore`).
# - `CompartirPixPin`: la extension de Compartir (mandar fotos, PDF,
#   enlaces, texto y ficheros a un proyecto desde cualquier app);
# - `WidgetsPixPin`: los widgets (ultimas capturas, tareas de hoy);
# - `PixPinKitTests`: las pruebas, en el simulador del iPad.
#
# Las extensiones no llevan PixPinKit ni el nucleo: hablan con la app por el
# buzon del App Group `group.io.github.1xmanmax.pixpin`
# (`Sistema/BuzonCompartido.swift`, que compilan tambien ellas). Los tres
# llevan ese grupo en sus entitlements (`Soporte/*.entitlements`); sin
# firmar (la CI) no hay grupo y la extension lo dice, pero todo compila.
name: PixPin
options:
  bundleIdPrefix: io.github.1xmanmax
  developmentLanguage: es
  deploymentTarget:
    iOS: "18.0"
packages:
  PixPinIPad:
    path: ../app
  PixPinCore:
    path: ../PixPinCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Solo iPad (2). El iPhone (1) vendra despues con su interfaz compacta.
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_COMPILATION_MODE: wholemodule
    # El xcframework solo trae arm64 (iPad y simulador de Apple Silicon).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  AppPixPin:
    type: application
    platform: iOS
    sources:
      - path: ../app/Sources/PixPin
      - path: App
    dependencies:
      - package: PixPinIPad
        product: PixPinKit
      - package: PixPinCore
        product: PixPinCore
      # Las extensiones van dentro de la app (`PlugIns/`).
      - target: CompartirPixPin
        embed: true
      - target: WidgetsPixPin
        embed: true
    settings:
      base:
        PRODUCT_NAME: PixPin
        PRODUCT_MODULE_NAME: PixPinIPadApp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.1xmanmax.pixpin
        INFOPLIST_FILE: Soporte/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Soporte/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets:
        - PixPinKitTests
  CompartirPixPin:
    type: app-extension
    platform: iOS
    sources:
      - path: Compartir
      # El buzon que comparte con la app (solo Foundation).
      - path: ../app/Sources/PixPinKit/Sistema/BuzonCompartido.swift
    settings:
      base:
        PRODUCT_NAME: CompartirPixPin
        PRODUCT_BUNDLE_IDENTIFIER: io.github.1xmanmax.pixpin.compartir
        INFOPLIST_FILE: Soporte/Compartir-Info.plist
        CODE_SIGN_ENTITLEMENTS: Soporte/Compartir.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  WidgetsPixPin:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: ../app/Sources/PixPinKit/Sistema/BuzonCompartido.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: WidgetsPixPin
        PRODUCT_BUNDLE_IDENTIFIER: io.github.1xmanmax.pixpin.widgets
        INFOPLIST_FILE: Soporte/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Soporte/Widgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  PixPinKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../app/Tests/PixPinKitTests
    dependencies:
      - target: AppPixPin
      - package: PixPinIPad
        product: PixPinKit
      # El nucleo es una biblioteca dinamica dentro de la app: las pruebas la
      # enlazan tambien (sin copiarla), si no sus simbolos no se encuentran.
      - package: PixPinCore
        product: PixPinCore
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.1xmanmax.pixpin.pruebas
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PixPin.app/PixPin"
        BUNDLE_LOADER: "$(TEST_HOST)"
